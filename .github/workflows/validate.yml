name: M300 OrcaSlicer validation
on:
  push:
    branches: [main]
    paths: ['profiles/**', 'presets/**', 'tests/**', 'tools/**', '.github/workflows/**', 'SHA256SUMS']
  pull_request:
    paths: ['profiles/**', 'presets/**', 'tests/**', 'tools/**', '.github/workflows/**', 'SHA256SUMS']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orca-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate local profiles, checksums and repository boundary
        run: |
          python tools/validate_profiles.py
          python -m compileall -q tests tools
          python tools/build_bundle.py --output "$RUNNER_TEMP/rebuilt.orca_printer"
          python - <<'PY'
          from pathlib import Path
          import os,zipfile
          source=next(Path('profiles').glob('*.orca_printer'))
          with zipfile.ZipFile(source) as a,zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'rebuilt.orca_printer') as b:
              assert set(a.namelist())==set(b.namelist())
              assert all(a.read(n)==b.read(n) for n in a.namelist())
          print('PASS: reproducible preset content; no host checkout or installation')
          PY
      - name: Install official pinned OrcaSlicer 2.3.2
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgtk-3-0t64 libwebkit2gtk-4.1-0 libglu1-mesa libsecret-1-0 libgstreamer1.0-0 libgl1-mesa-dri
          mkdir -p "$RUNNER_TEMP/orca"
          cd "$RUNNER_TEMP/orca"
          curl --fail --location --retry 3 -o Orca.AppImage 'https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.3.2/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.3.2.AppImage'
          echo 'c64336ceec37d941766e675cbaaaf5124e184402bf18177fbf81ba5102734ad8  Orca.AppImage' | sha256sum -c -
          chmod +x Orca.AppImage
          ./Orca.AppImage --appimage-extract > /dev/null
      - name: Slice all profiles and verify actual G-code and PA
        run: |
          xvfb-run -a python tests/audit_r3.py \
            --orca "$RUNNER_TEMP/orca/squashfs-root/AppRun" \
            --bundle profiles/Zortrax_M300_Classic_0p20_MicroSwiss_R3.orca_printer \
            --out "$RUNNER_TEMP/orca-audit"
          python - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'orca-audit/summary.json').read_text())
          assert result['material_pass']==17 and result['material_fail']==0
          assert result['pa_propagation_test']=='PASS' and result['host_tests_executed_here'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## OrcaSlicer validation\n17 material profiles PASS; 0 failures; PA propagation PASS. PEEK catalog-only. No host/MCU build, deployment or hardware test.\n')
          PY
      - name: Retain slicing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m300-orca-standalone-validation
          path: |
            ${{ runner.temp }}/orca-audit
            profiles
            MIGRATION.json
          retention-days: 14
