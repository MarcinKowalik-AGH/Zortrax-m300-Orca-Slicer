name: R5 Z-SUITE source preparation
on:
  push:
    branches: [feature/native-m300-r5]
    paths: [.github/workflows/r5-source-tools.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download portable extraction tools
        run: |
          mkdir -p out/tools out/wheels
          curl --fail --location --retry 2 https://constexpr.org/innoextract/files/innoextract-1.9-linux.tar.xz -o out/tools/innoextract.tar.xz
          python -m pip download --dest out/wheels dnfile dncil pefile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R5_SOURCE_TOOLS
          path: out
          retention-days: 2
