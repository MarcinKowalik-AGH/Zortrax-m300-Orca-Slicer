name: M300 Classic R7 quality profiles
on:
  push:
    branches: [feature/m300-classic-process-r7]
    paths: ['tools/build_classic_r7.py','tools/install_classic_r7.py','tests/test_classic_r7_install.py','tests/audit_classic_r7.py','.github/workflows/classic-r7.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: classic-r7-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reproducible profiles and test preservation
        run: |
          mkdir -p out
          python tools/build_classic_r7.py
          python tools/build_classic_r7.py --check
          python -m unittest discover -s tests -p test_classic_r7_install.py -v > out/installer-tests.log 2>&1
          cat out/installer-tests.log
      - name: Prepare pinned official Orca2.5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xdotool scrot libgtk-3-0t64 libwebkit2gtk-4.1-0 libglu1-mesa libsecret-1-0 libgstreamer1.0-0 libgl1-mesa-dri
          mkdir -p "$RUNNER_TEMP/orca"
          cd "$RUNNER_TEMP/orca"
          curl -fL --retry 2 -o Orca.AppImage https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.5.0/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.0.AppImage
          echo 'd13eb0a9cd618ed080ab6b82c64c0a60c4501aac91e88d5ac2c3b526fb141a7c  Orca.AppImage' | sha256sum -c -
          chmod +x Orca.AppImage
          ./Orca.AppImage --appimage-extract >/dev/null
      - name: Slice all quality processes and filaments
        run: |
          xvfb-run -a python tests/audit_classic_r7.py --orca "$RUNNER_TEMP/orca/squashfs-root/AppRun" --out "$PWD/out/slicing" > out/slicing-console.log 2>&1
          tail -4 out/slicing-console.log
      - name: Exercise actual native system-vendor loader
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          test -s "$SSL_CERT_FILE"
          mkdir -p out/gui/system
          cp -a native_r7/Zortrax* out/gui/system/
          python - <<'PY'
          import json
          from pathlib import Path
          j={'version':'2.5.0.0','preset_folder':'default','firstguide':{'finish':True},'stealth_mode':True,'models':[{'vendor':'Zortrax','model':'Zortrax M300 Classic','nozzle_diameter':'0.2;0.3;0.4;0.6'}],'filaments':['Generic PLA @Zortrax M300 0.4'],'presets':{'printer':'Zortrax M300 Classic 0.4 nozzle','print':'0.20mm Standard @Zortrax M300 Classic 0.4 nozzle','filaments':['Generic PLA @Zortrax M300 0.4']}}
          Path('out/gui/OrcaSlicer.conf').write_text(json.dumps(j))
          PY
          # Bound shutdown of the disposable test GUI, never a user's process.
          timeout --kill-after=5s 105s xvfb-run -a bash -c '"$RUNNER_TEMP/orca/squashfs-root/AppRun" --datadir "$PWD/out/gui" --debug 5 > out/gui-console.log 2>&1 & pid=$!; sleep 70; scrot out/gui-loader.png || true; kill "$pid" 2>/dev/null || true; sleep 2; kill -KILL "$pid" 2>/dev/null || true; wait "$pid" || true' || true
          python - <<'PY'
          from pathlib import Path
          import json,re
          logs='\n'.join(p.read_text(errors='replace') for p in Path('out/gui/log').glob('*') if p.is_file())
          Path('out/loader-errors.txt').write_text('\n'.join(l for l in logs.splitlines() if any(w in l.lower() for w in ['error','invalid','failed','exception'])))
          ok=bool(re.search(r'finished, presets_loaded\s+138\b',logs)) and Path('out/gui/system/Zortrax.opc').exists()
          result={'native_loader_pass':ok,'expected_presets':138,'actual_gui_platform':'Linux Xvfb','mac_user_install_test':False}
          Path('out/loader-result.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result));print(Path('out/loader-errors.txt').read_text()[-10000:])
          assert ok,'Native GUI vendor load not confirmed; no publication'
          PY
      - name: Publish validated files to feature branch
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          summary=json.loads(Path('out/slicing/summary.json').read_text());assert summary['pass']==138 and summary['fail']==0
          loader=json.loads(Path('out/loader-result.json').read_text());assert loader['native_loader_pass']
          summary.update(loader,installer_tests=14,global_config_edit=False,creality_files_changed=False)
          Path('evidence/R7_VALIDATION.json').write_text(json.dumps(summary,indent=2)+'\n')
          shutil.copy2('out/slicing/results.json','evidence/R7_GCODE_RESULTS.json')
          PY
          git fetch origin feature/m300-classic-process-r7
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native_r7 evidence/R7_PROCESS_CATALOG.json evidence/R7_VALIDATION.json evidence/R7_GCODE_RESULTS.json
          git commit -m 'Publish validated M300 Classic one-model quality profiles R7; no AppConfig edits'
          git push origin HEAD:feature/m300-classic-process-r7
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M300_CLASSIC_R7_EVIDENCE
          path: |
            out
            native_r7
            evidence/R7_*.json
          retention-days: 14
