name: R5 vendor metadata discovery
on:
  push:
    branches: [feature/native-m300-r5]
    paths: [.github/workflows/r5-source-metadata.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Locate archived legacy installer metadata
        run: |
          mkdir -p out
          python - <<'PY'
          import urllib.request,urllib.parse,json
          from pathlib import Path
          queries=['title:zortrax AND mediatype:software','title:(zortrax archive)','title:(Z-SUITE) AND mediatype:software']
          seen=set()
          for i,q in enumerate(queries):
              url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode({'q':q,'output':'json','rows':50})
              try:
                  data=urllib.request.urlopen(url,timeout=20).read();Path('out/search_'+str(i)+'.json').write_bytes(data)
                  for entry in json.loads(data)['response']['docs']:
                      ident=entry['identifier']
                      if ident in seen:continue
                      seen.add(ident);print('ITEM',ident,entry.get('title'))
                      meta=urllib.request.urlopen('https://archive.org/metadata/'+ident,timeout=20).read()
                      Path('out/meta_'+ident+'.json').write_bytes(meta)
                      for f in json.loads(meta).get('files',[]):
                          if 'suite' in f['name'].lower():print('FILE',ident,f['name'],f.get('size'))
              except Exception as exc:print(type(exc).__name__,str(exc))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R5_LEGACY_INDEX
          path: out
          retention-days: 2
