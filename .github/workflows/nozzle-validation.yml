name: M300 nozzle variants R4
on:
  push:
    branches: [main, feature/nozzle-variants-r4]
    paths: ['profiles/**', 'presets/**', 'nozzle_presets/**', 'NOZZLES.json', 'tools/**', 'tests/**', 'docs/NOZZLES_R4_PL.md', '.github/workflows/nozzle-validation.yml']
  pull_request:
    paths: ['profiles/**', 'nozzle_presets/**', 'NOZZLES.json', 'tools/build_nozzle_variants.py', 'tests/audit_nozzles.py', 'docs/NOZZLES_R4_PL.md', '.github/workflows/nozzle-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nozzle-r4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nozzles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build feature candidates or verify published generated files
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/feature/nozzle-variants-r4' ]; then
            python tools/build_nozzle_variants.py
          else
            python tools/build_nozzle_variants.py --check
          fi
          python tools/build_nozzle_variants.py --check
          python tools/validate_profiles.py
          python -m compileall -q tools tests
      - name: Prepare pinned OrcaSlicer 2.3.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgtk-3-0t64 libwebkit2gtk-4.1-0 libglu1-mesa libsecret-1-0 libgstreamer1.0-0 libgl1-mesa-dri
          mkdir -p "$RUNNER_TEMP/orca"
          cd "$RUNNER_TEMP/orca"
          curl --fail --location --retry 3 -o Orca.AppImage 'https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.3.2/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.3.2.AppImage'
          echo 'c64336ceec37d941766e675cbaaaf5124e184402bf18177fbf81ba5102734ad8  Orca.AppImage' | sha256sum -c -
          chmod +x Orca.AppImage
          ./Orca.AppImage --appimage-extract > /dev/null
      - name: Actual slicing of 3 nozzles x 18 materials plus 3 PA trials
        run: |
          xvfb-run -a python tests/audit_nozzles.py \
            --orca "$RUNNER_TEMP/orca/squashfs-root/AppRun" \
            --out "$RUNNER_TEMP/nozzle-audit"
      - name: Save evidence and publish only validated feature candidates
        env:
          TARGET_BRANCH: feature/nozzle-variants-r4
        run: |
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          source=Path(os.environ['RUNNER_TEMP'])/'nozzle-audit'
          summary=json.loads((source/'summary.json').read_text())
          assert summary['status']=='PASS' and summary['software_material_pass']==51 and summary['pa_tests_pass']==3
          evidence=Path('evidence');evidence.mkdir(exist_ok=True)
          shutil.copyfile(source/'summary.json',evidence/'NOZZLE_VALIDATION_R4.json')
          shutil.copyfile(source/'results.json',evidence/'NOZZLE_GCODE_RESULTS_R4.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## M300 Classic nozzle profiles\n0.4 mm = supported Z-SUITE Classic diameter; 0.3/0.6 mm = custom Klipper extensions, not OEM presets.\n\n51 material/nozzle slicing checks PASS; 3 PA trials PASS; 3 PEEK entries catalog-only. Original 0.4 bundle unchanged. No GUI or hardware tests.\n')
          PY
          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF" != "refs/heads/$TARGET_BRANCH" ]; then
            echo 'Read-only validation; not publishing to source branch.'
            exit 0
          fi
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          readme=Path('README.md')
          banner='''## Profile średnic dysz R4

**M300 Classic w Z-SUITE: 0,4 mm.** Warianty 0,3 i 0,6 mm są własnymi rozszerzeniami dla Klippera, nie profilami OEM. Nie mylić z M300 Plus. Każdy wariant ma jeden proces 0,20 mm i osobne filamenty/PA.

| Dysza | Pakiet |
|---|---|
| 0,3 mm — Klipper custom | [Import](profiles/Zortrax_M300_Classic_N0p3_0p20_CUSTOM_R4.orca_printer?raw=true) |
| 0,4 mm — niezmieniona baza R3 | [Import](profiles/Zortrax_M300_Classic_0p20_MicroSwiss_R3.orca_printer?raw=true) |
| 0,6 mm — Klipper custom | [Import](profiles/Zortrax_M300_Classic_N0p6_0p20_CUSTOM_R4.orca_printer?raw=true) |

[Komplet ZIP](profiles/M300_Orca_0p3_0p4_0p6_R4.zip?raw=true) · [Źródła, parametry i instalacja](docs/NOZZLES_R4_PL.md) · [Testy wszystkich wariantów](evidence/NOZZLE_VALIDATION_R4.json)

**Po fizycznej zmianie dyszy trzeba również poprawić `nozzle_diameter` w Klipperze. Import Orca nie zmienia hosta.** Z-PEEK pozostaje katalogowy; PA=0 czeka na pomiar osobno dla każdej dyszy i materiału. Nowe profile nie podnoszą temperatur, prędkości, przyspieszeń ani przepływu. Test silnika: 51 kombinacji materiał/dysza PASS oraz 3 testy przekazywania PA; bez testu GUI i druku fizycznego.

---

'''
          text=readme.read_text()
          if '## Profile średnic dysz R4' not in text:
              title,rest=text.split('\n',1)
              readme.write_text(title+'\n\n'+banner+rest.lstrip())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nozzle_presets profiles NOZZLES.json SHA256SUMS README.md evidence/NOZZLE_VALIDATION_R4.json evidence/NOZZLE_GCODE_RESULTS_R4.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish runtime-validated custom 0.3 and 0.6 nozzle profiles; preserve original 0.4'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - name: Retain complete evidence and downloadable bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M300_NOZZLES_R4
          path: |
            profiles
            nozzle_presets
            NOZZLES.json
            SHA256SUMS
            docs/NOZZLES_R4_PL.md
            tools/build_nozzle_variants.py
            tests/audit_nozzles.py
            evidence/NOZZLE_*R4.json
            ${{ runner.temp }}/nozzle-audit
          retention-days: 14
